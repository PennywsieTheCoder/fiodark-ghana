<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031d3a" />
    <meta name="description" content="FIODARK Ghana provides dependable freight forwarding, customs clearance, transport and logistics consultancy services." />
    <script>
      (() => {
        const saved = localStorage.getItem('fiodark-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%fiodark-logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%fiodark-logo.png" />
    <title>FIODARK Ghana | Freight & Logistics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
